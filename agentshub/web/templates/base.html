<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AgentsHub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/">AgentsHub</a>
      <nav>
        {% if signed_in %}
          <a href="/dashboard">Dashboard</a>
          <form class="inline" method="post" action="/signout"><button class="secondary" type="submit">Sign out</button></form>
        {% else %}
          <a href="/docs">API docs</a>
        {% endif %}
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
